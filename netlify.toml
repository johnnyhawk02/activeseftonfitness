[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Crosby was renamed to Crosby Lakeside (Crosby Baths is a different, non-Active Sefton pool).
[[redirects]]
  from = "/centres/crosby"
  to = "/centres/crosby-lakeside"
  status = 301
